<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header-head('Iniciar Sesión')}"></head>
<body class="bg-light">

<header th:replace="~{fragments/layout :: header-nav}"></header>

<main class="container my-auto py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card card-custom p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="bg-primary text-white rounded-circle d-inline-flex p-3 mb-2 shadow-sm">
                        <i class="bi bi-hospital fs-2"></i>
                    </div>
                    <h3 class="fw-bold text-dark">Portal MediGestión</h3>
                    <p class="text-muted small">Ingrese su DNI o Correo Institucional para acceder a sus servicios</p>
                </div>

                <div th:replace="~{fragments/layout :: alerts}"></div>

                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold text-secondary small">DNI O CORREO INSTITUCIONAL</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="username" name="username" placeholder="Ej. 45892134 o correo@hospital.pe" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold text-secondary small">CONTRASEÑA</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm mb-3">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Acceder al Sistema
                    </button>
                </form>

                <div class="text-center pt-3 border-top">
                    <span class="text-muted small">¿Es un nuevo paciente asegurado?</span>
                    <a th:href="@{/registro}" class="text-decoration-none fw-semibold small ms-1">Registrarse aquí</a>
                </div>

                <!-- Credenciales Rápidas para la Sustentación Académica -->
                <div class="alert alert-secondary mt-4 p-2 small border-0 bg-light">
                    <div class="fw-bold text-dark mb-1"><i class="bi bi-info-circle me-1"></i> Accesos Demo para Evaluación UTP:</div>
                    <div class="d-flex justify-content-between text-muted" style="font-size: 0.78rem;">
                        <span><strong>Paciente:</strong> 45892134 / Password123</span>
                    </div>
                    <div class="d-flex justify-content-between text-muted" style="font-size: 0.78rem;">
                        <span><strong>Médico:</strong> sarah.jenkins@medigestion.com / medico123</span>
                    </div>
                    <div class="d-flex justify-content-between text-muted" style="font-size: 0.78rem;">
                        <span><strong>Admin:</strong> admin@medigestion.com / admin123</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
