# ==============================================================================
# PERFIL DE PRODUCCIÓN / AWS CLOUD (EC2 + RDS POSTGRESQL)
# ==============================================================================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:medigestion_db}?sslmode=prefer
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# HikariCP Pool Optimizado para AWS Cloud
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# Seguridad de Logs en Producción
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN
logging.level.com.medigestion=INFO
