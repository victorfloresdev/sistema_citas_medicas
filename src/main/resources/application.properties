# ==============================================================================
# MEDIGESTIÓN - CONFIGURACIÓN BASE (SPRING BOOT 3 + THYMELEAF)
# ==============================================================================
spring.application.name=medigestion-web
spring.profiles.active=dev

# Servidor Web Embebido
server.port=8080
server.servlet.context-path=/
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Archivos estáticos y subida de archivos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Actuator & Métricas (Hito 80%)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=MediGestión - Sistema de Citas Médicas
info.app.version=v0.8.0-final
info.app.author=Equipo Curso Integrador I (UTP)
